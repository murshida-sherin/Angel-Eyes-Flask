{% extends 'indexcaretaker.html' %}
{% block body %}
    <style>
#customers {
  font-family: Arial, Helvetica, sans-serif;
  border-collapse: collapse;
  width: 50%;
}

#customers td, #customers th {
  border: 1px solid #ddd;
  padding: 8px;
}

#customers tr:nth-child(even){background-color: #f2f2f2;}

#customers tr:hover {background-color: #ddd;}

#customers th {
  padding-top: 12px;
  padding-bottom: 12px;
  text-align: left;
  background-color: #669999;
  color: white;
}
</style>

<body>
<form action="submitfamiliarperson" method="post" enctype="multipart/form-data" name="form1" id="form1">
  <table width="200" border="1" id="customers">
    <tr>
      <th>Blind Name </th>
      <td><label>
        <select name="select">

          {% for i in val %}
          <option value="{{i[0]}}">{{i[1]}}   {{i[2]}}</option>
          {% endfor %}

        </select>
      </label></td>
    </tr>
    <tr>
      <th>Name</th>
      <td><label>
        <input type="text" name="textfield" required pattern="[A-Z a-z.]{3,25}" />
      </label></td>
    </tr>
    <tr>
      <th>Image</th>
      <td><input type="file" name="file" required /></td>
    </tr>
    <tr>
      <th>Relation</th>
      <td><input type="text" name="textfield2" required pattern="[A-Z a-z.]{3,25}"  /></td>
    </tr>
    <tr>
      <td>&nbsp;</td>
      <td><input type="submit" name="Submit" value="REGISTER" class="btn btn-secondary " /></td>
    </tr>
  </table>
</form>
</body>
{% endblock %}
