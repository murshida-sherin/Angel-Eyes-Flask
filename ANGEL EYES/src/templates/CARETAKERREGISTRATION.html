{% extends 'index.html' %}
{% block body %}
    <style>
#customers {
  font-family: Arial, Helvetica, sans-serif;
  border-collapse: collapse;
  width: 50%;
}

#customers td, #customers th {
  border: 1px solid #ddd;
  padding: 8px;
}

#customers tr:nth-child(even){background-color: #f2f2f2;}

#customers tr:hover {background-color: #ddd;}

#customers th {
  padding-top: 12px;
  padding-bottom: 12px;
  text-align: left;
  background-color: #669999;
  color: white;
}
</style>

<body><form action="caretakerreg" method="post"><table width="200" border="1" id="customers">
  <tr>
    <th>First Name </th>
    <td><input type="text" name="textfield" required pattern="[A-Z a-z.]{3,25}" /></td>
  </tr>
  <tr>
    <th>Last Name </th>
    <td><input type="text" name="textfield2" required pattern="[A-Z a-z.]{3,25}" /></td>
  </tr>
  <tr>
    <th>Gender</th>
    <td><input name="radiobutton" type="radio" value="male" checked />
      Male 
      <input name="radiobutton" type="radio" value="female" />
      Female</td>
  </tr>
  <tr>
    <th>Date of Birth </th>
    <td><input type="date" name="textfield10" required /></td>
  </tr>
  <tr>
    <th>Place</th>
    <td><input type="text" name="textfield3" required pattern="[A-Z a-z.]{3,25}" /></td>
  </tr>
  <tr>
    <th>Post</th>
    <td><input type="text" name="textfield4" required pattern="[A-Z a-z.]{3,25}" /></td>
  </tr>
  <tr>
    <th>Pin</th>
    <td><input type="text" name="textfield5" required pattern="[0-9]{6}" /></td>
  </tr>
  <tr>
    <th>Phone</th>
    <td><input type="text" name="textfield6" required pattern="[6789][0-9]{9}" /></td>
  </tr>
  <tr>
    <th>Email</th>
    <td><input type="text" name="textfield7" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,3}" /></td>
  </tr>
  <tr>
    <th>Username</th>
    <td><input type="text" name="textfield8" required /></td>
  </tr>
  <tr>
    <th>Password</th>
    <td><input type="text" name="textfield9" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" required  /></td>
  </tr>
  <tr>
    <td>&nbsp;</td>
    <td><input type="submit" name="Submit" value="Register" class="btn btn-secondary " /></td>
  </tr>
</table>
</form>
</body>

{% endblock %}
