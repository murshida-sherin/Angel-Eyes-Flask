{% extends 'indexadmin.html' %}
{% block body %}
 <style>
#customers {
  font-family: Arial, Helvetica, sans-serif;
  border-collapse: collapse;
  width: 25%;
}

#customers td, #customers th {
  border: 1px solid #ddd;
  padding: 8px;
}

#customers tr:nth-child(even){background-color: #f2f2f2;}

#customers tr:hover {background-color: #ddd;}

#customers th {
  padding-top: 12px;
  padding-bottom: 12px;
  text-align: left;
  background-color: #669999;
  color: white;
}
</style>
<body>
<form id="form1" name="form1" method="post" action="/sendreplynew">
  <table width="200" border="1" id="customers">
    <tr>
      <th>REPLY</th>
      <td><input type="text" name="textfield" required pattern="[A-Z a-z.]{3,200}" /></td>
      <td><input type="submit" name="Submit" value="SENT" class="btn btn-secondary " /></td>
    </tr>
  </table>
</form>
</body>
{% endblock %}
